name: installer-contract

on:
  pull_request:
    paths:
      - 'install.sh'
      - 'deepwind-init.sh'
      - 'CLAUDE.md.starter'
      - 'LICENSE'
      - 'VERSION'
      - 'lib/**'
      - 'agents/**'
      - 'skills/**'
      - 'frameworks/**'
      - 'payload/**'
      - '.agents/**'
      - 'plugins/**'
      - 'codex/**'
      - 'config/channels/**'
      - 'release/**'
      - 'tests/installer/**'
      - 'tests/plugin/**'
      - 'tests/doctor/**'
      - 'tests/docs/**'
      - 'tests/validate_codex_toml.py'
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/installer.yml'
      - '.github/workflows/weekly-release.yml'
  push:
    branches: [main]
    paths:
      - 'install.sh'
      - 'deepwind-init.sh'
      - 'CLAUDE.md.starter'
      - 'LICENSE'
      - 'VERSION'
      - 'lib/**'
      - 'agents/**'
      - 'skills/**'
      - 'frameworks/**'
      - 'payload/**'
      - '.agents/**'
      - 'plugins/**'
      - 'codex/**'
      - 'config/channels/**'
      - 'release/**'
      - 'tests/installer/**'
      - 'tests/plugin/**'
      - 'tests/doctor/**'
      - 'tests/docs/**'
      - 'tests/validate_codex_toml.py'
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/installer.yml'
      - '.github/workflows/weekly-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer-matrix:
    name: ${{ matrix.name }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-gnu-bash
            os: ubuntu-22.04
          - name: macos-bash-3-2
            os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Validate workflow syntax
        # rhysd/actionlint is a container action. Keep it mandatory on the
        # Linux matrix leg without preventing the macOS portability leg from
        # running the remaining installer checks.
        if: runner.os == 'Linux'
        uses: rhysd/actionlint@03d0035246f3e81f36aed592ffb4bebf33a03106 # v1.7.7

      - name: Install test tools
        shell: bash
        run: |
          set -euo pipefail
          if [ "${RUNNER_OS}" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y bats ripgrep shellcheck
          else
            brew update
            brew install bats-core ripgrep shellcheck
          fi
          npm install --global @openai/codex@0.145.0
          test "$(codex --version)" = "codex-cli 0.145.0"
          python3 -c 'import sys, tomllib; assert sys.version_info >= (3, 11)'

      - name: Verify generated standalone installer is current
        shell: bash
        run: |
          set -euo pipefail
          before=$(shasum -a 256 deepwind-init.sh | awk '{print $1}')
          bash release/build-installer.sh deepwind-init.sh
          after=$(shasum -a 256 deepwind-init.sh | awk '{print $1}')
          test "$before" = "$after"

      - name: Run portable fixture matrix
        shell: bash
        run: |
          bash release/test-manifest.sh
          bash release/test-workflow-contract.sh
          bash tests/installer/matrix-contract.sh

      - name: Run Bats installer suite
        shell: bash
        run: bats tests/installer

      - name: Validate Codex distribution and onboarding contracts
        shell: bash
        run: |
          set -euo pipefail
          bash tests/plugin/test-codex-plugin.sh
          bash tests/plugin/assert-child-mcp-policy.sh
          bash tests/plugin/test-codex-plugin-lifecycle.sh
          bash tests/doctor/run-shell-tests.sh
          bash tests/docs/test-installation-docs.sh

      - name: Run ShellCheck
        shell: bash
        run: |
          shellcheck deepwind-init.sh lib/*.sh release/*.sh \
            tests/installer/*.sh tests/installer/*.bash \
            tests/plugin/*.sh tests/doctor/*.sh tests/docs/*.sh
